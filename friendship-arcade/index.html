<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Friendship Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e5;color:#534a3b;font:18px Georgia,serif}header{padding:24px}a{color:inherit}main{text-align:center;padding:0 20px 80px}h1{font-size:clamp(30px,4vw,48px);font-weight:400}.machine{position:relative;width:min(420px,100%);margin:45px auto 0}.machine svg{width:100%;display:block;fill:#b7c3ad;stroke:#726651;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.screen{position:absolute;top:8%;left:21%;width:58%;height:33%;display:flex;align-items:center;justify-content:center;padding:18px;font-size:20px;line-height:1.5;margin:0}.token{position:absolute;bottom:11%;left:37%;width:26%;border:0;background:none;cursor:pointer;color:inherit;padding:0}.token svg{fill:#d4b47b;transition:transform .3s}.token:hover svg{transform:translateY(-5px)}.token:focus-visible{outline:2px solid #9b7455;outline-offset:4px}.coin{animation:drop .5s ease}@keyframes drop{50%{transform:translateY(-30px) rotate(40deg)}}@media(max-width:400px){.screen{font-size:17px;padding:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.game{width:100%}.game p{font-size:18px;margin:0 0 28px}.track{height:50px;position:relative;--position:0}.light{position:absolute;top:10px;width:22px;height:22px;border-radius:48% 52% 45% 55%;background:#b9755c;left:calc(var(--position)*80%);transform:translateX(-50%)}.second-light{background:#839575;left:calc(80% - var(--position)*80%)}.caught .light{animation:celebrate .6s ease infinite alternate}@keyframes celebrate{to{transform:translateX(-50%) translateY(-9px)}}@media(prefers-reduced-motion:reduce){.caught .light{animation:none}}
[hidden]{display:none!important}.catch-button{position:absolute;bottom:15%;left:35%;width:30%;min-height:48px;border:2px solid #726651;border-radius:45% 50% 48% 43%;background:#b9755c;color:#fff8e9;font:20px Georgia,serif;cursor:pointer;box-shadow:0 4px 0 #726651}.catch-button:active{transform:translateY(3px);box-shadow:0 1px 0 #726651}.catch-button:focus-visible{outline:2px solid #534a3b;outline-offset:5px}.token.inserting{animation:insert-token .5s ease forwards;pointer-events:none}@keyframes insert-token{to{transform:translate(76px,-59px) scale(.12) rotate(80deg);opacity:0}}
</style></head><body><header><a href="/">← Salene’s World</a></header><main><h1>The Friendship Arcade</h1><div class="machine"><svg viewBox="0 0 420 550" aria-hidden="true"><path d="M63 12q149-6 296 2l15 190-34 63 20 265q-143 10-292-1l20-263-42-60Z"/><path fill="#faf5e7" d="m83 45 254-1 4 188-257 2Z"/><path d="M89 334h247M112 360l-4 64m-19-3h39M280 375h35"/><circle fill="#b9755c" cx="280" cy="347" r="9"/><circle fill="#d4b47b" cx="312" cy="347" r="9"/><path d="M85 459h247"/></svg><div class="screen"><div class="game"><p id="game-note" aria-live="polite">Catch the moment.</p><div class="track" aria-hidden="true"><i class="light first-light"></i><i class="light second-light"></i></div></div></div><button class="token" aria-label="Insert token to play"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8q40 1 40 41T50 90Q9 88 10 50T50 8Z"/><circle cx="50" cy="49" r="30"/><path d="m50 29 6 13 15 2-11 11 2 15-12-7-14 7 3-15-11-11 16-2Z"/></svg></button><button class="catch-button" hidden>Catch</button></div></main><script type="module">
import {destinations} from '../src/destinations.js';
document.querySelector('header a').href=import.meta.env.BASE_URL;
const notebookScript=document.createElement('script');notebookScript.src=import.meta.env.BASE_URL+'travel-notebook.js';notebookScript.onload=()=>window.mountNotebook({base:import.meta.env.BASE_URL,current:'arcade',places:destinations.map(p=>({...p,href:p.href?import.meta.env.BASE_URL+p.href:undefined}))});document.head.append(notebookScript);

const button=document.querySelector('.token'),catchButton=document.querySelector('.catch-button'),note=document.querySelector('#game-note'),track=document.querySelector('.track');let running=false,start=0,frame=0;
function animate(time){const t=((time-start)%1800)/1800;const x=(1-Math.cos(t*Math.PI*2))/2;track.style.setProperty('--position',x);frame=requestAnimationFrame(animate)}
button.onclick=()=>{if(button.disabled)return;button.disabled=true;button.classList.add('inserting');note.textContent='One little moment…';setTimeout(()=>{button.hidden=true;button.classList.remove('inserting');running=true;start=performance.now();note.textContent='Tap when they meet.';track.classList.remove('caught');catchButton.hidden=false;catchButton.focus();frame=requestAnimationFrame(animate)},matchMedia('(prefers-reduced-motion: reduce)').matches?0:500)};
catchButton.onclick=()=>{if(!running)return;running=false;cancelAnimationFrame(frame);const x=Number(track.style.getPropertyValue('--position'));const caught=Math.abs(x-.5)<.16;note.textContent=caught?'There you are!':'Almost. Again?';track.classList.toggle('caught',caught);catchButton.hidden=true;button.hidden=false;button.disabled=false;button.setAttribute('aria-label','Insert token to play again');button.focus()};
</script></body></html>
